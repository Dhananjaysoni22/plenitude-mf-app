name: NAS Automated Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # This forces GitHub to run this job on your NAS, not on GitHub's cloud servers
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to NAS Docker
        run: |
          # 1. Define where your app lives on the NAS
          APP_DIR="/volume1/docker/plenitude" 
          
          mkdir -p $APP_DIR
          
          # Install rsync if missing inside the container
          if ! command -v rsync &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y rsync
          fi
          
          # 2. Sync the fresh code from GitHub (excluding .env to protect passwords)
          rsync -av --delete --exclude='.env' ./ $APP_DIR/
          
          # 3. Rebuild the Docker containers
          cd $APP_DIR
          
          # Stop old containers
          docker compose -f docker-compose-nas.yml down
          
          # Start new containers in the background using the specific NAS compose file
          docker compose -f docker-compose-nas.yml up -d --build
          
          # Wait 5 seconds for containers to initialize, then sync database schema
          sleep 5
          docker compose -f docker-compose-nas.yml exec -T backend npx prisma db push
          
          # Clean up old unused images to save disk space
          docker image prune -f
